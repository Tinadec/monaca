[package]
name = "monaca-server"
description = "The monaca axum 0.8 binary: protocol routes, the /v1 management API, /internal and CLI subcommands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "monaca-server"
path = "src/main.rs"

[dependencies]
monaca-types = { workspace = true }
monaca-audit = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# `tower::ServiceExt::oneshot` is what the router test drives the app with; `axum::body::to_bytes`
# reads the response. No other test-only dependency is needed, so the workspace stays at one
# answer per package (docs/contracts/m0.md §4.1).
tower = { workspace = true }

[lints]
workspace = true
