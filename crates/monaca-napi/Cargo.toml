[package]
name = "monaca-napi"
description = "napi-rs v3 bindings exposing the I/O-free core to @monaca/core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# A cdylib is what the Node/Bun loader requires; the rlib is what lets `cargo test` link the
# crate's own unit tests. Without the rlib, `cargo nextest run --workspace` cannot build the
# test harness for this package at all.
crate-type = ["cdylib", "rlib"]

[dependencies]
monaca-core = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

# The workspace forbids `unsafe_code`; this crate is the one place that cannot comply. napi-rs
# v3's `#[napi]` expansion emits its module registration (the ctor blocks and FFI shims) with
# `#[allow(unsafe_code)]` around genuinely unsafe code, and a `forbid` cannot be relaxed by an
# `allow` — not even from a macro. A member's [lints] table replaces the workspace's wholesale,
# so the rest of the workspace's set is re-declared here unchanged.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
