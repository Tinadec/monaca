# rustfmt runs only in CI (`cargo fmt --all` in rust.yml → artifact "rustfmt-patch").
# Stable-only options; nightly-only keys would make the CI job warn on every run.
edition = "2024"
style_edition = "2024"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
